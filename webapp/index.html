<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!--
      Fonts moved here from a CSS @import in index.css. A CSS @import of an
      external stylesheet is more fragile than an HTML <link> — content/ad
      blockers (Brave Shields is on by default, most ad-block extensions too)
      are more likely to interfere with it, and a failed @import at the top
      of a stylesheet can leave the rest of that file's application to the
      page unpredictable depending on the browser. <link> tags are the
      standard, more robust way to load Google Fonts in a Vite app.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>GNSS-Denied Vehicle Localization</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
